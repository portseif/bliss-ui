name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      # Swift 6.3 defaults to the native build system, which copies
      # Localizable.xcstrings uncompiled (no .lproj folders, so every string
      # falls back to English). Swift Build compiles the catalog, and it's the
      # default from 6.4 on.
      - name: Build
        run: swift build --build-system swiftbuild
      - name: Test
        run: swift test --build-system swiftbuild
